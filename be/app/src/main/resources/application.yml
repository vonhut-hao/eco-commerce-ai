server:
  port: ${local.server.port}

spring:
  application:
    name: flix-platform
    region:
      static: us-east-1

  config:
    import:
      - optional:classpath:identity.yml
      - optional:classpath:common.yml

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  output:
    ansi:
      enabled: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    aws:
      region:
        static: us-east-1

# Health check for prod env
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    env:
      show-values: never

# API key for chatbot
gemini:
  api-key: ${GEMINI_API_KEY}
